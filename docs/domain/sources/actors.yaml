  content:
    role: 执行版本管理、源码与构建模型观察、测试、构建、制品、发布、部署、监控或告警操作并产生可观察事实。
    responsibilities:
    - 按自身合同执行明确请求的外部操作。
    - 返回观察或执行的精确范围、配置、能力、环境、输入、输出、退出状态、时间和限制等事实。
    - 保持自身数据、权限和运行状态的权威。
