  content:
    role: 在真实授权和适用范围内作出专业审查、正式审核或外部合规结论。
    responsibilities:
    - 明确审查主体、范围、依据、时间、结论和限制。
    - 只对真实完成的审查或正式机制负责。
    - 提供可核实的审查或合规证据。
    not_responsible_for:
    - 被程序校验、智能编码代理自检或项目负责人接受所替代。
    - 为未审查范围提供背书。
    - 决定项目负责人的产品取舍。
