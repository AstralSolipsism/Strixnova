    - 决定产品目标、领域含义、目标架构或工程语义。
    - 把命令成功解释成产品正确、用户接受或外部合规。
    - 替项目负责人确认结果。
- fact_id: FACT-F88E0CDB464A46B9
  status: draft
  title: 真实审查或外部合规主体
  kind: actor
  product_capability_ids:
