  content:
    identity: 由权威种类、稳定权威身份和不可复用的修订身份共同区分的一份精确长期目标版本。
    responsibilities:
    - 保存草案、待确认、已确认、已取代等独立状态。
    - 记录上游精确修订、演进关系、确认负责人和确认日期。
    - 防止实质变化沿用旧确认或静默改写历史含义。
