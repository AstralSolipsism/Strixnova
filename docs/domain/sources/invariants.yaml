  scope_fact_ids: []
  dependency_fact_ids:
  - FACT-73E63F97C5B64499
  - FACT-9DADF2842D094773
  content:
    statement: 对已有项目，每个可确认方向必须精确绑定当前产品修订、引用至少一项由智能编码代理判断相关的产品能力，并对该修订全部非目标和约束各处置一次且写明理由；对尚无产品权威的新项目必须明确绑定空上下文。程序不得生成或评价相关性和理由。产品修订或护栏集合变化、处置缺失重复或引用悬空时，方向及全部下游确认必须失效；标记需要重新考虑的护栏在新产品修订独立确认前继续约束实施。
