  content:
    subject_fact_id: FACT-A1C2E3F405162738
    states:
    - state: drafting
      meaning: 智能编码代理正在绑定当前权威基线、候选修订和下游处置。
    - state: review_ready
      meaning: 确定性结构完整，跨产物语义复核没有未解决的高影响问题，可以并入工程方案确认。
    - state: incorporated
      meaning: 所列候选修订已经分别完成适用确认，变更集只保留历史追溯作用。
    - state: invalidated
      meaning: 任一基线在候选采用前已经变化，原变更集必须重新形成。
    transitions:
    - from_state: drafting
      to_state: review_ready
      trigger: 结构、引用、覆盖和声明状态检查通过，智能编码代理完成跨产物语义复核。
      guards:
      - 产品、领域、目标架构和实现对齐四类当前采用核心权威均被精确绑定。
      - 所有下游影响均有明确处置。
      - 没有未解决的高影响语义发现。
      resulting_event_fact_ids: []
    - from_state: review_ready
      to_state: incorporated
      trigger: 变更涉及的长期权威候选已经按各自决定权完成确认和采用。
      guards: []
      resulting_event_fact_ids: []
    - from_state: drafting
      to_state: invalidated
      trigger: 任一被绑定基线在候选采用前发生变化。
      guards: []
      resulting_event_fact_ids: []
    - from_state: review_ready
      to_state: invalidated
      trigger: 任一被绑定基线在候选采用前发生变化。
      guards: []
      resulting_event_fact_ids: []
