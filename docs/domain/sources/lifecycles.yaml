    states:
    - state: current
      meaning: 对齐绑定的目标和代码版本仍有效且声明覆盖闭合。
    - state: needs_review
      meaning: 上游、代码或证据变化使一个或多个判断需要重新评估。
    - state: reviewing
      meaning: 智能编码代理正在逐项调查和更新受影响判断。
    - state: complete
      meaning: 新对齐候选已完成观察范围、关系、归属和目标责任覆盖及门禁检查，等待被当前项目基线采用。
    transitions:
    - from_state: current
      to_state: needs_review
      trigger: 产品、领域、架构、代码、验证或对齐自身发生相关变化。
      guards: []
      resulting_event_fact_ids:
      - FACT-CCEF92A5D2114880
    - from_state: needs_review
      to_state: reviewing
      trigger: 智能编码代理开始处理受影响判断。
      guards: []
      resulting_event_fact_ids: []
    - from_state: reviewing
      to_state: complete
      trigger: 必需观察范围、文件、关系和目标责任重新达到完整覆盖；所有观察缺口与未知均保持可见并有解决计划。
      guards:
      - 可确定漂移门禁通过。
      - 不存在被解释为空关系的未支持、未执行、失败、部分覆盖、未解析或歧义观察。
      resulting_event_fact_ids: []
    - from_state: complete
      to_state: current
      trigger: 项目采用新的精确对齐和代码版本。
      guards: []
      resulting_event_fact_ids: []
