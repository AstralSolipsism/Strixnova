  status: draft
  title: 产品发现结果只进入现有权威
  kind: domain_rule
  product_capability_ids:
  - CAPABILITY-D054964736FE4AE1
  - CAPABILITY-44EB4FA0B1994587
  - CAPABILITY-857E4CA751A34FA1
  - CAPABILITY-386C88B6F742458B
  - CAPABILITY-A02E89CB77574ABE
  scope_fact_ids: []
  dependency_fact_ids:
  - FACT-FA45768A3F2541A8
  - FACT-346BD66898834B1E
  content:
    statement: 继续建设的长期产品事实进入 ProjectProductDefinition，领域语义进入 ProjectDomainModel，跨单元持久取舍进入 ProjectArchitectureDescription
      或 ADR，一次建设内容进入 DirectionDecision 和 WorkItem。Product Brief、PRFAQ、发现结论及可选工作材料不得取得独立写权、状态或确认；非权威工作材料不得进入 `.strixnova`、保存完整对话或复制已经进入正式权威的当前事实。
    applies_when: 产品发现形成继续建设、搁置、否定或仅变清楚的结论时。
- fact_id: FACT-D2E54729BD8E4263
  status: draft
