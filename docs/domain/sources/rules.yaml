- fact_id: FACT-4CA07D0AA8924D7D
  status: draft
  title: 程序不得替代引导式形成的语义判断
  kind: domain_rule
  product_capability_ids:
  - CAPABILITY-D054964736FE4AE1
  - CAPABILITY-A02E89CB77574ABE
  - CAPABILITY-731BB1BA932543DD
  - CAPABILITY-BCD586FBB6054556
  scope_fact_ids: []
  dependency_fact_ids:
  - FACT-DF782F3974E94BCF
  - FACT-4FD08D68267441B6
  content:
    statement: 程序不得通过关键词、文件数量、代码行数、活动名称或固定流程替代智能编码代理对产品发现动作、假设与证据、意图缺口、交付跨度、保障深度和推荐下一步的语义判断；这些信号只能作为调查依据，程序只校验现有合同、明确声明和政策下限。
    applies_when: 开展产品发现、形成方向、推荐规划路径、拆分建设事项或裁剪工程保障时。
- fact_id: FACT-ED887913315E4A85
  status: draft
  title: 产品发现动作按真实缺口选择
  kind: domain_rule
  product_capability_ids:
  - CAPABILITY-D054964736FE4AE1
  scope_fact_ids: []
  dependency_fact_ids:
  - FACT-FA45768A3F2541A8
  - FACT-DF782F3974E94BCF
  - FACT-4FD08D68267441B6
  content:
    statement: 智能编码代理必须先检查用户原话、当前权威、项目资料、必要代码和可取得证据，再选择当前最能消除承重缺口的一个产品发现动作；动作可以跳过、组合或重复，但不得固定为阶段、要求负责人选择模式或在信息足够时继续追问。程序不得按关键词、文档数量、代码规模或固定评分生成路线。
    applies_when: 产品或功能想法尚不足以形成需求、长期权威候选或建设方向时。
- fact_id: FACT-ABF86B04DB1C477F
  status: draft
  title: 产品发现区分事实、决定、假设与证据
  kind: domain_rule
  product_capability_ids:
  - CAPABILITY-D054964736FE4AE1
  scope_fact_ids: []
  dependency_fact_ids:
  - FACT-C8E6F2891E194C50
  - FACT-DF782F3974E94BCF
  - FACT-FA45768A3F2541A8
  content:
    statement: 智能编码代理必须明确区分项目可查事实、项目负责人决定、仍待验证的假设和带来源及时效的外部证据；模型已有知识只能提出调查假设，不能冒充当前外部事实。证据只能支持其实际范围，想法增强、被否定、暂时搁置或仅变清楚均可结束发现，不能把所有结果推向建设。
    applies_when: 产品发现依赖项目事实、用户取舍、外部信息或尚未验证的核心主张时。
