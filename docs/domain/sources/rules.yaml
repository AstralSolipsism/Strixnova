    applies_when: 一个建设事项新增、修改、退役或更名任何长期权威内容时。
- fact_id: FACT-FC7D3E9FA0B1C2D3
  status: draft
  title: 跨产物语义复核由智能编码代理负责
  kind: domain_rule
  product_capability_ids:
  - CAPABILITY-731BB1BA932543DD
  - CAPABILITY-BCD586FBB6054556
  scope_fact_ids: []
  dependency_fact_ids:
  - FACT-C3E4A5061728395A
  - FACT-DF782F3974E94BCF
  content:
    statement: 智能编码代理必须从产品到领域、术语到规则、领域到架构、计划到实施、孤立内容、场景、非功能风险和证据边界八个角度复核方案；当方案中的长期权威候选正文实际形成后，还必须在候选展示和负责人确认前提交一份绑定精确候选身份、修订和规范正文身份的最终候选复核，正文变化即失效。需要负责人决定的已处置发现只能引用已确认方向或项目基线中的已确认决定，来源材料和普通证据不能冒充负责人决定；程序只检查声明、引用、正文身份和阻断状态，不评价复核文字和严重程度是否正确，也不新增负责人确认点。
    applies_when: 形成或重做完整工程方案，或方案内长期权威候选正文形成并准备展示确认时。
- fact_id: FACT-D02D863191514763
  status: draft
  title: 本地信任主体与执行边界必须显式区分
  kind: domain_rule
  product_capability_ids:
  - CAPABILITY-859140B6A57D408A
  - CAPABILITY-51FB5CB931344603
  - CAPABILITY-4AAC0DAFEEDA495F
  - CAPABILITY-FDB7B365AFC84F66
  scope_fact_ids: []
  dependency_fact_ids:
  - FACT-C8E6F2891E194C50
  - FACT-DF782F3974E94BCF
  - FACT-4FD08D68267441B6
  - FACT-2D3C638B3E92417A
  content:
    statement: Strixnova 信任本地项目负责人作出语义决定，并信任其明确授权的智能编码代理在给定工作空间提交候选和请求操作；项目文件、项目自定义程序、实现观察结果、外部工具输出、测试结果、内容身份和文档只能作为输入或证据，不能取得语义决定权。只读项目检查及其内置静态观察不得执行项目自定义转换、项目代码、构建脚本、钩子或远程操作，无法保证时必须拒绝并报告观察不可用或部分覆盖；确需调用语言或构建生态工具的解析观察，以及已确认方案中的验证、提交和本地合入，属于负责人明确授权的外部执行，会以宿主用户权限运行且可能执行项目代码或本地工具行为。Strixnova
      提供流程与证据边界，不提供针对恶意本地用户、恶意已授权代理或恶意项目命令的安全沙箱、宿主认证或多用户隔离。
    applies_when: 程序读取项目事实、请求外部执行或向用户说明安全保证范围时。
- fact_id: FACT-AD8E4FA0B1C2D3E4
  status: draft
  title: 实施切片按依赖顺序推进
  kind: domain_rule
  product_capability_ids:
  - CAPABILITY-731BB1BA932543DD
  - CAPABILITY-51FB5CB931344603
  - CAPABILITY-4AAC0DAFEEDA495F
  - CAPABILITY-BCD586FBB6054556
  scope_fact_ids: []
  dependency_fact_ids:
  - FACT-B2D3F40516273849
  - FACT-32F33CAB000C4F0D
  - FACT-ADDCB3B236194270
  content:
    statement: 每项计划操作和验证命令必须恰好归入一个实施切片；相同命令若属于不同切片，因观察的是不同代码状态而必须保留不同命令身份和回执，只能归并同一切片内的完全重复命令。长期权威候选的起草、精确正文复核和负责人确认属于切片实施前的治理阶段：智能编码代理可以按自己决定的切片拆分，先在全部计划治理路径内形成完整候选包；程序只允许这些已经由真实候选治理路径证明且属于已确认方案的文件提前出现，不把它们记作切片完成，也不放行任何普通业务路径。完整候选包确认后，程序才只允许累计工作树包含已完成切片和首个依赖已满足切片的计划路径，并只允许当前切片进入验证。前序切片的操作不得在后续切片重写；唯一例外是已计划的同一份实现对齐草稿，可在一个明确的最终刷新切片中用实施后真实证据更新，不转移原操作归属，也不开放普通源码的跨切片改写。只属于后续切片的普通路径与计划外路径必须分别报告，程序不得决定怎样拆分工作，也不得启动、分配或控制智能编码代理。
      每项操作和完成依据同时限定所属仓库；必要依赖可以跨仓库，但不会产生新的事项确认或代理调度权。
    applies_when: 工程方案进入实施、验证或重新规划时。
- fact_id: FACT-77865B53D2B34969
  status: draft
  title: 负责人确认说明按决策价值自适应组织
  kind: domain_rule
  product_capability_ids:
  - CAPABILITY-A02E89CB77574ABE
  - CAPABILITY-731BB1BA932543DD
  - CAPABILITY-BCD586FBB6054556
  - CAPABILITY-FDB7B365AFC84F66
  scope_fact_ids: []
  dependency_fact_ids:
  - FACT-D4F5B61728395A6B
  - FACT-C8E6F2891E194C50
  content:
    statement: 请求方向、完整工程方案或实际结果确认前，智能编码代理必须提供足以决定的说明，覆盖当前或修改前状态、候选变化、产品效果、工程逻辑、影响与风险、未知与限制、推荐以及确认后授权和不授权的动作；具体顺序、标题和篇幅按实际复杂度组织，确无决策价值的内容可以省略。方向说明强调愿望如何收敛及只授权继续工程调查；方案说明强调改前改后、实施验证及不授权提交；结果说明同时对照方案与实际、改前与当前，并说明只授权后续本地
      Git 交付。用户表示看不懂、提问或要求换一种说法时，代理必须解释同一候选且不触发确认或版本变化；只有实质纠正才退回并形成新候选。同一轮最多保留五个高影响问题，并继续坚持一次只讨论一个实质决定。
    applies_when: 展示方向、工程方案、阻断、纠偏或实际结果时。
- fact_id: FACT-EBDA1DF2249B477A
  status: draft
  title: 引导式形成贯穿候选形成与纠偏
  kind: domain_rule
  product_capability_ids:
