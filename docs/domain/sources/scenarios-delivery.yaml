  content:
    scenario_type: blocking
    capability_fact_id: FACT-0127B7C06DA94946
    actor_fact_ids:
    - FACT-DF782F3974E94BCF
    - FACT-4FD08D68267441B6
    preconditions:
    - 收到验证执行请求。
    trigger: 验收、约束或风险遗漏核验安排，实际结果遗漏非命令目标处置，或命令未在方案中选择、版本或状态过期、违反验证政策、工作范围越界、尝试启动智能编码代理或无法形成真实回执。 或仅有服务地址、必要部署版本无法核验、运行期间必要版本变化，或所需源码层面证据无法取得。
    steps:
    - 程序在执行前拒绝可确定的不允许请求。
    - 错误返回稳定原因和可纠正字段，不让程序推断替代命令。
    - 智能编码代理决定修改方案、修正输入或如实记录未运行。
    - 已发生请求和输出保留，但不能据地址可达或一次成功宣称精确内容组合完整通过；相应验收保持缺口。
    outcome: 不允许的进程未被启动，验证状态不会伪装成通过。
    postconditions:
    - 阻断和未运行状态保持可见。
