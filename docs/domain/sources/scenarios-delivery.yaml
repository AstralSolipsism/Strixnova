    capability_fact_id: FACT-0127B7C06DA94946
    actor_fact_ids:
    - FACT-DF782F3974E94BCF
    - FACT-2D3C638B3E92417A
    preconditions:
    - 已有失败、受限、过期或被错误解释的验证回执。
    trigger: 实施被修正、运行环境变化、证据不足或结果解释与回执不一致。
    steps:
    - 保留旧回执而不把失败记录改写成通过。
    - 智能编码代理判断是否需要修复、重测、补测或降低结论范围。
    - 新运行产生独立回执并重新解释实际支持范围。
    - 后端相关输入在联调后变化时，复核依赖它的联调证据及整体结果接受；有依据证明无关的证据可复用。
    - 无法确定依赖范围时保持未知，不靠刷新内容指纹或回写原运行使旧测试看起来覆盖新版本。
    outcome: 当前实际结果引用正确回执，历史失败和限制仍可追溯。
    postconditions:
    - 重测没有自动替代仍相关的未运行项。
