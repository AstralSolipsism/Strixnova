    - FACT-4FD08D68267441B6
    preconditions:
    - 用户、问题、期望结果、关键边界和成功信号已经足以下游使用。
    trigger: 智能编码代理判断是否仍有会改变产品方向的承重缺口。
    steps:
    - 智能编码代理核对用户原话、当前权威、项目事实和重大假设。
    - 没有承重缺口时直接形成现有产品、领域、架构或方向候选，不运行完整产品发现动作。
    - 不生成 Product Brief、PRFAQ 或非权威工作材料，并向负责人说明为何可以停止发现。
    outcome: 明确想法直接进入现有候选形成路径，没有承担无必要的产品发现流程。
    postconditions:
    - 后续候选继续遵守现有权威、确认和工程保障合同。
- fact_id: FACT-43BC6F5E5D644B37
  status: draft
  title: 模糊解决方案回到真实问题
  kind: domain_scenario
