    capability_fact_id: FACT-5F57CFB4FDC74459
    actor_fact_ids:
    - FACT-DF782F3974E94BCF
    - FACT-4FD08D68267441B6
    preconditions:
    - 存在工程评估候选。
    trigger: 方向或长期目标版本过期，影响分类缺失，权威变更缺少基线或下游处置，语义复核存在未解决的高影响发现，实施切片遗漏、成环、越级或写入冲突，验证命令不符合政策，或方案扩大到未确认范围。 或方案中的仓库归属矛盾、把消费依赖当作修改授权、缺少共同验收及必要版本依据。
    steps:
