    - 智能编码代理调查语义缺口，从跨产物复核中说明风险、推荐和限制。
    - 需要改变方向或长期目标时先回到相应定档点。
    outcome: 工程方案保持未确认，版本工作区和实施不得开始。
    postconditions:
    - 阻断不能通过空占位或降低保障等级绕过。
