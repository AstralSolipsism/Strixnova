    scenario_type: cancellation
    capability_fact_id: FACT-463994C54BF647D4
    actor_fact_ids:
    - FACT-C8E6F2891E194C50
    - FACT-DF782F3974E94BCF
    preconditions:
    - 产品想法依赖一个决定成败但尚未验证的核心主张。
    trigger: 反例、项目事实或当前证据推翻该承重主张。
    steps:
    - 智能编码代理明确说明推翻依据、证据实际支持的范围和仍不能证明的内容。
    - 智能编码代理给出最便宜的后续验证选择，同时说明继续建设会承担的返工风险。
    - 项目负责人选择否定或搁置想法时，不创建虚假方向、WorkItem 或交付义务。
    outcome: 产品发现以否定或搁置想法结束，而不是被强制推向编码。
    postconditions:
    - 只有负责人后来基于新证据重新开启时才继续形成建设候选。
- fact_id: FACT-0D7A44EA56DB427E
