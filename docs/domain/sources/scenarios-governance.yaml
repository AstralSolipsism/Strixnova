  content:
    scenario_type: correction
    capability_fact_id: FACT-463994C54BF647D4
    actor_fact_ids:
    - FACT-C8E6F2891E194C50
    - FACT-DF782F3974E94BCF
    preconditions:
    - 项目负责人只给出一个偏好功能或技术方案，真实问题和期望变化尚不清楚。
    trigger: 智能编码代理发现直接扩写该方案会把未经验证的解法误当成需求。
    steps:
    - 智能编码代理先说明当前理解和决定所依赖的最大缺口。
    - 从受影响的人、当前替代、问题代价和期望变化中选择一个最重要问题；只有相关时才区分使用者、购买者和付费者。
    - 过早锁定方案时，扩展受众、价值机制、范围或验证方式有实质差异的备选，并允许负责人纠正问题定义。
    outcome: 讨论从偏好方案回到真实问题和可比较选择，没有把首个方案直接扩写成需求。
    postconditions:
    - 受影响的产品认识和下游候选按负责人纠正重新形成。
