  content:
    scenario_type: blocking
    capability_fact_id: FACT-463994C54BF647D4
    actor_fact_ids:
    - FACT-C8E6F2891E194C50
    - FACT-DF782F3974E94BCF
    - FACT-4FD08D68267441B6
    preconditions:
    - 市场、法规、竞品、用户行为或技术现状会实质改变产品决定。
    trigger: 当前项目资料和已有知识不足以支持该外部事实。
    steps:
    - 智能编码代理使用当前可访问来源调查，区分来源发布日期与事件日期，并说明适用范围和限制。
    - 无法取得来源时保留明确未知；只能由真实实验判断时转为最小验证选择。
    - Strixnova 程序只保存和校验现有合同事实，不执行研究或认证证据结论。
    outcome: 外部未知保持可见且阻止未经证实的主张被写成当前产品事实。
    postconditions:
    - 取得足够证据、负责人接受不确定性或真实实验完成前，不把该主张当成已证实前提。
- fact_id: FACT-99893ACBCF894C8F
  status: draft
  title: 方向正常收敛并确认
  kind: domain_scenario
  product_capability_ids:
  - CAPABILITY-A02E89CB77574ABE
  scope_fact_ids:
  - FACT-5ABABA148CFB4B87
  dependency_fact_ids:
  - FACT-C8E6F2891E194C50
  - FACT-DF782F3974E94BCF
  - FACT-4FD08D68267441B6
  - FACT-ED05BCEB08B94F1E
  content:
    scenario_type: normal
    capability_fact_id: FACT-5ABABA148CFB4B87
    actor_fact_ids:
    - FACT-C8E6F2891E194C50
    - FACT-DF782F3974E94BCF
    - FACT-4FD08D68267441B6
    preconditions:
    - 产品或功能想法已经足以命名一个具体建设事项，项目负责人提出该事项的期望结果。
    trigger: 智能编码代理开始判断该事项是否足以安全形成建设方向。
    steps:
    - 程序只读提供当前产品目的、能力目录、全部非目标与约束及其精确修订身份；无产品权威的新项目明确提供空上下文。
    - 智能编码代理结合用户原话调查项目和环境，选择相关能力，对全部产品护栏逐项说明适用、不适用或需要重新考虑的理由，并记录假设与重开条件。
    - 意图已经足够时直接形成方向候选；仍有真实缺口时，将真正会改变方向的问题收束到五个以内，再逐个给出推荐、影响和不处理后果；可查事实和已生效护栏不重复转嫁给负责人。
    - 目标、范围、非目标、约束、取舍和验收方向闭合后，智能编码代理为方向需求、方向约束和验收条件形成稳定身份，明确需求到验收的覆盖，并说明相对历史方向保留、退出或使用新身份的条目；完成后停止追问。
    - 程序校验上下文版本、合法引用、全部护栏唯一覆盖、条目身份格式与唯一性、验收到需求引用、需求覆盖、历史身份不复活和完整结构，但不判断语义连续性；项目负责人确认可理解的完整精确方向版本。
    outcome: 已确认方向成为当前建设事项唯一方向事实，不覆盖项目长期目标。
    postconditions:
    - 工程评估只能引用该精确方向版本。
- fact_id: FACT-B427CF758D0C4D11
  status: draft
  title: 方向确认被阻断
  kind: domain_scenario
  product_capability_ids:
  - CAPABILITY-A02E89CB77574ABE
  scope_fact_ids:
  - FACT-5ABABA148CFB4B87
  dependency_fact_ids:
  - FACT-C8E6F2891E194C50
  - FACT-DF782F3974E94BCF
  - FACT-4FD08D68267441B6
  - FACT-ED05BCEB08B94F1E
  content:
    scenario_type: blocking
    capability_fact_id: FACT-5ABABA148CFB4B87
    actor_fact_ids:
    - FACT-C8E6F2891E194C50
    - FACT-DF782F3974E94BCF
    - FACT-4FD08D68267441B6
    preconditions:
    - 存在方向草案。
    trigger: 缺少一个会实质改变方向的决定、决定上下文过期、能力引用悬空、护栏处置遗漏重复、方向条目身份前缀错误或重复、验收引用未知需求、需求未被验收覆盖、历史退出身份复活、结构不完整，或项目负责人明确表示无法理解。
    steps:
    - 程序拒绝版本、引用、覆盖、条目身份、历史复用、缺失字段、矛盾状态或虚假可确认标记，但不判断相关性、语义连续性和理由是否正确。
    - 智能编码代理改用具体场景说明当前唯一问题，不倾倒内部身份和完整结构。
    - 无法由项目调查解决时才等待项目负责人决定。
    outcome: 方向保持未确认，工程方案和实施不得开始。
    postconditions:
    - 真实阻断原因保持可见。
