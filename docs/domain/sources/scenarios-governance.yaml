    scenario_type: correction
    capability_fact_id: FACT-5ABABA148CFB4B87
    actor_fact_ids:
    - FACT-C8E6F2891E194C50
    - FACT-DF782F3974E94BCF
    preconditions:
    - 方向已经展示或确认。
    trigger: 项目负责人纠正目标或取舍，或调查发现会实质改变方向的新事实。
    steps:
    - 受影响的方向确认、决定上下文绑定和下游方案确认失效。
    - 智能编码代理重新读取当前决定上下文，说明变化、影响范围、原假设是否仍成立和推荐处理。
    - 智能编码代理逐项说明哪些方向身份因顺序调整或非语义澄清而保留，哪些因替换、拆分、合并或移除而退出并使用新身份。
    - 修订后的完整方向重新完成身份、引用、需求覆盖、历史不可复用与结构校验，并由项目负责人重新确认；即使部分条目身份保持不变，旧工程方案也不得继续有效。
    outcome: 新方向生效，旧方向保留历史且不能继续授权实施。
    postconditions:
    - 下游方案进入重新评估。
