  title: BMAD Method 产品发现与规划方法来源
  path: docs/engineering/method-sources.md
  status: current
  usage: 参考并在本地验证后选择性复制、裁剪或修改 BMAD Method 官方项目中与问题界定、选项扩展、 想法压测、决定研究、Product Brief 和 PRFAQ 有关的方法内容；采用 MIT 许可。导入内容由
    Strixnova 本地接管，不绑定外部提交或升级，不引入 BMAD 运行时、角色体系、品牌命名、平行 工作流或兼容承诺。版权、许可和官方来源统一由根 README 维护并随分发物机械携带。
