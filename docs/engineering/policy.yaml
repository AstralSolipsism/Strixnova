verification_command_policy:
  allowed_programs:
  - program: .venv/Scripts/python.exe
    purpose: 运行项目测试、构建和隔离安装验收入口。
    argument_policy: exact_plan_only
  - program: git
    purpose: 执行明确属于只读检查或本地交付的版本管理操作。
