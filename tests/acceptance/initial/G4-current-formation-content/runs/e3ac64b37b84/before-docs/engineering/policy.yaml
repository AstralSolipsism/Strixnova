policy_statements:
  quality:
  - 结构、语义和效果证据分开报告。
  testing:
  - 以真实断言检查函数行为；开发反馈与正式验证记录分别说明。
  security:
  - 不建立代理身份或会话。
  release:
  - 只验证本地交付。
  operations:
  - 外部操作必须有真实回执。
  maintenance:
  - 新接口接管后删除旧机制。
  compatibility:
  - 隔离测试不读取旧权威合同。
