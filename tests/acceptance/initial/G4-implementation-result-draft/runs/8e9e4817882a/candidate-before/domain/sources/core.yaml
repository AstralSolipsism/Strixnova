      preconditions:
        - 调用方持有两个整数分钟刻度。
      trigger: 调用 duration(start, end)，其中 end <= start。
      steps:
        - 校验 end 是否严格大于 start，结果为否。
      outcome: 抛出 ValueError，不返回时长。
      postconditions:
