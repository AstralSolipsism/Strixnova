        - 成员已通过可信宿主会话认证。
        - 该成员有一份本人提交的待审核预约申请。
      trigger: 成员请求撤回指定申请。
      steps:
        - 从可信宿主会话获取操作者身份。
        - 校验申请归属于操作者本人。
        - 校验申请当前处于待审核状态。
        - 使用乐观并发控制尝试将状态从待审核转为已撤回。
        - 记录一条审计条目（操作者、待审核→已撤回、撤回）。
      outcome: 申请状态变为已撤回，操作成功。
      postconditions:
        - 该申请不可再被审批或再次撤回（幂等重复除外）。
        - 审计记录完整保留。

