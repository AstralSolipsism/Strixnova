        - 新状态。
        - 操作者身份。
        - 操作身份。

  # ── 领域规则 ──────────────────────────────
  - fact_id: FACT-A00000000000000E
    status: "confirmed"
    title: 只允许操作本人申请
    kind: domain_rule
