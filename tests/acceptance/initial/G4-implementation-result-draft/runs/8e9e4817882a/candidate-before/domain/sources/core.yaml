        且不重复记录审计条目。
      applies_when: 成员对已撤回的本人申请再次执行撤回操作时。

  - fact_id: FACT-A000000000000011
    status: "confirmed"
    title: 身份信任规则
    kind: domain_rule
    product_capability_ids:
