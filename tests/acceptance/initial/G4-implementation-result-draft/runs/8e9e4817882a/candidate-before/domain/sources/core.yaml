    product_capability_ids: [CAPABILITY-2222222222222222]
    scope_fact_ids: [FACT-A000000000000001]
    dependency_fact_ids:
      - FACT-A00000000000000B
    content:
      subject_fact_id: FACT-A00000000000000B
      states:
        - state: 待审核
          meaning: 申请已提交，等待负责人审批决定。
        - state: 已批准
          meaning: 负责人已批准该申请，产生已生效预约。
        - state: 已拒绝
          meaning: 负责人已拒绝该申请。
        - state: 已撤回
          meaning: 申请成员已主动撤回该待审核申请。
      transitions:
        - from_state: 待审核
          to_state: 已批准
          trigger: 负责人批准该申请。
          guards: [申请仍处于待审核状态]
          resulting_event_fact_ids: [FACT-A00000000000000D]
        - from_state: 待审核
          to_state: 已拒绝
          trigger: 负责人拒绝该申请。
          guards: [申请仍处于待审核状态]
          resulting_event_fact_ids: [FACT-A00000000000000D]
        - from_state: 待审核
          to_state: 已撤回
          trigger: 申请成员撤回本人申请。
          guards:
            - 操作者是申请的提交成员。
            - 申请仍处于待审核状态。
          resulting_event_fact_ids: [FACT-A00000000000000D]

