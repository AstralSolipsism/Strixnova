    content:
      responsibility: >-
        管理预约申请的区间校验、生命周期状态、成员撤回、
        审计记录和负责人周报读取。
      decisions:
        - 申请身份、状态含义和决定权在所有单元中统一定义。
        - 身份来自可信宿主会话，不信任传入角色或所有者字段。
        - 只允许待审核状态撤回。
        - 撤回与审批并发时只允许一个版本成功。
      excluded_responsibilities:
        - 不负责已批准预约的取消。
        - 不负责缴费。
        - 不负责自动发送周报。
        - 不负责日期转换或时区处理。

